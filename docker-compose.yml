services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: fengji_pg
    environment:
      POSTGRES_USER: fengji
      POSTGRES_PASSWORD: fengji_dev
      POSTGRES_DB: fengji
    ports:
      - "5432:5432"
    volumes:
      - fengji_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fengji -d fengji"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fengji_pg_data:
