<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0b10">
  <title>峰极量化 · 加入交流群</title>
  <link rel="stylesheet" href="css/apple.css">
</head>
<body class="community-page" data-theme="dark">
  <div id="navMount"></div>
  <main class="page community-page-main">
    <section class="hero community-hero">
      <h1 class="hero-title">加入峰极量化交流群</h1>
      <p class="hero-subtitle">扫码加入官方 QQ 群，获取使用说明、版本更新与策略讨论。</p>
    </section>

    <div class="community-layout">
      <article class="card community-card community-card-primary community-qq-card">
        <header class="community-card-head">
          <span class="community-badge">推荐</span>
          <h2 class="community-card-title">官方 QQ 交流群</h2>
          <p class="community-card-desc">使用 QQ 扫一扫，加入峰极量化用户群</p>
        </header>
        <figure class="community-qr-wrap">
          <img
            class="community-qr"
            src="assets/qr/qq-group.jpg"
            width="240"
            height="240"
            alt="峰极量化 QQ 群二维码"
            loading="lazy"
          >
        </figure>
        <div class="community-card-foot community-qq-foot">
          <div class="community-info-box community-qq-steps-box">
            <ol class="community-steps">
              <li>打开 QQ，点击右上角「+」或扫一扫</li>
              <li>扫描上方二维码，申请加入群聊</li>
              <li>入群后可咨询回测、监测与订阅相关问题</li>
            </ol>
          </div>
        </div>
      </article>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    FengJiApp.initShell("community.html");
    FengJiApp.setTheme("dark");
  </script>
</body>
</html>
