[project]
name = "fengji-core"
version = "0.1.0"
description = "FengJi OS identity engine and DS01-DS09 strategy primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fengji_core*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = [".", "../../src"]
